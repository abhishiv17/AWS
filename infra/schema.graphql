scalar AWSJSON

type Participant {
  id: ID!
  name: String!
  role: String
  sectorId: String
  joinedAt: Float!
  connected: Boolean
  reconnectUntil: Float
}

type DrillRoom {
  drillId: ID!
  code: String!
  hostId: ID!
  maxPlayers: Int!
  phase: String!
  startsAt: Float
  participants: [Participant!]!
  createdAt: Float!
  scenarioVersion: String!
  seed: Int!
  outcome: String
}

input ParticipantInput {
  id: ID!
  name: String!
  role: String
  sectorId: String
  joinedAt: Float!
  connected: Boolean
  reconnectUntil: Float
}

input CreateDrillInput {
  drillId: ID
  code: String!
  hostId: ID
  maxPlayers: Int
  phase: String
  startsAt: Float
  participants: [ParticipantInput!]
  createdAt: Float
  scenarioVersion: String
  seed: Int
  outcome: String
}

input JoinDrillInput {
  code: String!
  participant: ParticipantInput!
}

input DrillIntentInput {
  type: String!
  state: AWSJSON
  command: String
  evidenceId: String
  clientSentAt: Float
  idempotencyKey: String
}

type CommandAcknowledgement {
  id: ID!
  command: String!
  accepted: Boolean!
  reason: String
  at: Float!
  stateVersion: Int!
  eventSequence: Int!
}

type EvidenceRecord {
  id: ID!
  sectorId: String!
  label: String!
  source: String!
  status: String!
  observedAt: Float
  verifiedAt: Float
  updatedAt: Float!
  nextAction: String!
}

type RouteMessage {
  messageId: ID!
  drillId: ID!
  senderId: ID!
  senderSector: String!
  targetSector: String!
  direction: String!
  kind: String!
  confidence: String!
  urgency: String!
  createdAt: Float!
  expiresAt: Float!
  caption: String!
  acknowledgedAt: Float
}

type SubmitIntentResult {
  acknowledgement: CommandAcknowledgement
  routeMessage: RouteMessage
  evidence: EvidenceRecord
}

type CommandResult {
  ok: Boolean!
  error: String
}

type DrillEvent {
  drillId: ID!
  eventId: ID!
  sequence: Int!
  eventType: String!
  actorRole: String
  sectorId: String
  payload: AWSJSON
  serverTime: Float!
}

type ScenarioProposal {
  scenarioVersion: String!
  seed: Int!
  smokeOriginSector: String!
  blockedRoute: String!
  smokeIntensity: Float!
  intervention: String!
  briefing: String!
  fallback: Boolean!
}

input ScenarioRequestInput {
  scenarioVersion: String
  seed: Int
  drillId: ID
}

type PhraseResult {
  phrase: String!
  caption: String!
  objectKey: String
  fallback: Boolean!
}

input SpeakPhraseInput {
  phrase: String!
  voiceId: String
  engine: String
  languageCode: String
}

type AarAnswers {
  safeEvacuation: String!
  coordinationFailure: String!
  nextPractice: String!
}

type AarMetrics {
  decisionDelayMs: Float
  verificationDelayMs: Float
  communicationDelayMs: Float
  usefulMessageRate: Float
  exposureBucket: String
  routeDeviation: String
}

type AarInsight {
  code: String!
  explanation: String!
}

type AarReport {
  drillId: ID!
  scenarioVersion: String!
  rulesVersion: String!
  outcome: String!
  coordinationScore: Float
  status: String!
  answers: AarAnswers!
  metrics: AarMetrics!
  insights: [AarInsight!]!
  replayRecommendation: String!
  generatedAt: Float!
}

type Query {
  drill(code: String!): DrillRoom
  afterActionReport(drillId: ID!): AarReport
}

type Mutation {
  createDrill(input: CreateDrillInput!): DrillRoom!
  joinDrill(input: JoinDrillInput!): DrillRoom!
  startDrill(drillId: ID!, playerId: ID): CommandResult!
  submitIntent(drillId: ID!, intent: DrillIntentInput!): SubmitIntentResult!
  leaveDrill(drillId: ID!, playerId: ID): CommandResult!
  publishDrillEvent(event: DrillEventInput!): DrillEvent!
  generateScenario(input: ScenarioRequestInput): ScenarioProposal!
  speakPhrase(input: SpeakPhraseInput!): PhraseResult!
}

input DrillEventInput {
  drillId: ID!
  eventId: ID!
  sequence: Int!
  eventType: String!
  actorRole: String
  sectorId: String
  payload: AWSJSON
  serverTime: Float!
}

type Subscription {
  onDrillEvent(code: String!): DrillEvent
    @aws_subscribe(mutations: ["publishDrillEvent"])
}
